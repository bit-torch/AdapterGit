[package]
name = "agit"
version = "0.1.0"
edition = "2021"
description = "AI-native Git tool - pure Rust implementation"
license = "Apache-2.0"
repository = "https://github.com/bit-torch/AdapterGit"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
flate2 = "1"
sha1 = "0.10"
anyhow = "1"
