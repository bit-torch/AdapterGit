[package]
name = "agit"
version = "0.8.0"
edition = "2021"
description = "AI-native Git tool - pure Rust implementation"
license = "Apache-2.0"
repository = "https://github.com/bit-torch/AdapterGit"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
flate2 = "1"
sha1 = "0.10"
anyhow = "1"
url = "2"
native-tls = "0.2"
toml = "0.8"

[features]
default = ["tag"]
# Future: annotated tag object support (tag create/list/delete CLI)
tag = []
