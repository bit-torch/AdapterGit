# Winget manifest for AdapterGit Lite Edition
# Submit via PR to: https://github.com/microsoft/winget-pkgs

PackageIdentifier: bit-torch.agit-lite
PackageVersion: 0.14.0
PackageLocale: en-US
Publisher: bit-torch
PackageName: AdapterGit (Lite Edition)
License: Apache-2.0
