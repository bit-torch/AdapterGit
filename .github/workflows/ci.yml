name: CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Code Style
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -- --check

  clippy:
    name: Clippy Lints
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --verbose

  build-release:
    name: Build Release
    runs-on: windows-latest
    needs: [check, clippy, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --verbose
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/release/agit.exe release/agit.exe
          Copy-Item LICENSE release/LICENSE
          Compress-Archive -Path release/* -DestinationPath agit-windows-x86_64.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agit-windows-x86_64
          path: agit-windows-x86_64.zip
          retention-days: 30

  release:
    name: GitHub Release
    runs-on: windows-latest
    needs: [build-release]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: agit-windows-x86_64
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: agit-windows-x86_64.zip
          generate_release_notes: true
