name: CI

on:
  push:
    branches: ["main", "feat/*", "fix/*"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # ── 代码风格 & 静态检查 (单平台即可) ──
  check:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check
      - run: cargo check --all-targets --all-features

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # ── 安全审计 ──
  security:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  # ── 测试 (Linux + macOS + Windows) ──
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --verbose --all-features --all-targets

  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --verbose --all-features --all-targets

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --verbose --all-features --all-targets

  # ── 烟雾测试 (端到端用户场景) ──
  smoke-linux:
    name: Smoke Tests (Linux)
    runs-on: ubuntu-latest
    needs: [test-linux]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Run smoke tests
        run: |
          chmod +x tests/smoke/linux_smoke.sh
          AGIT_BIN="${{ github.workspace }}/target/release/agit" tests/smoke/linux_smoke.sh

  smoke-windows:
    name: Smoke Tests (Windows)
    runs-on: windows-latest
    needs: [test-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Run smoke tests
        shell: pwsh
        run: |
          $env:AGIT_BIN = "${{ github.workspace }}\target\release\agit.exe"
          .\tests\smoke\windows_smoke.ps1

  # ── Release 构建 (双平台) ──
  build-linux:
    name: Build Release (Linux)
    runs-on: ubuntu-latest
    needs: [check, clippy, test-linux, smoke-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --verbose
      - run: |
          mkdir -p release
          cp target/release/agit release/agit
          cp LICENSE release/LICENSE
          tar -czf agit-linux-x86_64.tar.gz -C release .
          cp target/release/agit agit-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: agit-linux-x86_64
          path: |
            agit-linux-x86_64.tar.gz
            agit-linux-x86_64
          retention-days: 30

  build-windows:
    name: Build Release (Windows)
    runs-on: windows-latest
    needs: [check, clippy, test-windows, smoke-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --verbose
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/release/agit.exe release/agit.exe
          Copy-Item LICENSE release/LICENSE
          Compress-Archive -Path release/* -DestinationPath agit-windows-x86_64.zip -Force
          Copy-Item target/release/agit.exe agit-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: agit-windows-x86_64
          path: |
            agit-windows-x86_64.zip
            agit-windows-x86_64.exe
          retention-days: 30

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agit-linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: agit-windows-x86_64
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            agit-linux-x86_64.tar.gz
            agit-linux-x86_64
            agit-windows-x86_64.zip
            agit-windows-x86_64.exe
          generate_release_notes: true
